<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor de cifras</title>
<style>
  :root {
    --bg: #e6ebf1;
    --panel: #ffffff;
    --ink: #1a2230;
    --muted: #667085;
    --line: #d3dae4;
    --chord: #1f45c4;
    --mono: "Courier New", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px; min-height: 100vh;
    background: var(--bg); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; grid-template-columns: minmax(280px, 360px) 1fr; gap: 20px; align-items: start;
  }
  @media (max-width: 800px) { body { grid-template-columns: 1fr; } }

  .editor {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px; display: flex; flex-direction: column; gap: 6px;
  }
  .editor label, .editor .lbl { font-weight: 600; margin-top: 8px; }
  .editor input, .editor textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px;
    font: inherit; color: inherit; background: #fff;
  }
  .editor textarea { font-family: var(--mono); min-height: 320px; resize: vertical; line-height: 1.4; }
  .editor input:focus, .editor textarea:focus, button:focus-visible { outline: 2px solid var(--chord); outline-offset: 1px; }
  .hint { color: var(--muted); font-size: 13px; margin: 4px 0 8px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    font: inherit; font-weight: 600; padding: 9px 16px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: #fff; color: var(--ink);
  }
  .btn.primary { background: var(--chord); border-color: var(--chord); color: #fff; }

  .sheet-wrap {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 28px 32px; min-height: 320px;
  }
  #sheetTitle { font: 700 28px/1.2 "Palatino Linotype", Palatino, Georgia, serif; margin: 0; }
  .head { margin-bottom: 24px; }
  #sheetKey { margin: 6px 0 0; font: 600 16px var(--mono); color: var(--chord); text-align: left; }
  #sheetTitle.ph { color: #a4adbb; font-weight: 400; font-style: italic; }
  #sheet { font-family: var(--mono); font-size: 16px; overflow-x: auto; padding-bottom: 6px; }
  .empty-msg { color: var(--muted); font-family: system-ui, sans-serif; font-size: 14px; }

  .row { width: max-content; min-width: 100%; }
  .chords { position: relative; height: 1.7em; cursor: pointer; border-radius: 3px; }
  .chords:hover { background: rgba(31, 69, 196, .06); }
  .chords::after {
    content: ""; position: absolute; top: 2px; bottom: 2px; left: var(--mx, 0); width: 1ch;
    background: var(--chord); opacity: 0; border-radius: 2px; pointer-events: none;
  }
  .chords:hover::after { opacity: .18; }
  .chords.only { background: rgba(31, 69, 196, .05); border-bottom: 1px dashed var(--line); margin-bottom: .3em; }
  .chord {
    position: absolute; top: 0; left: calc(var(--col) * 1ch);
    font-weight: 700; color: var(--chord); line-height: 1.7em; white-space: pre; cursor: pointer;
  }
  .chord:hover { text-decoration: underline; }
  .lyric { white-space: pre; line-height: 1.3; }
  .gap { height: 1.2em; }

  .pop {
    position: fixed; z-index: 50; background: #fff; border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(20, 30, 50, .22); padding: 8px; width: 330px; max-width: calc(100vw - 8px);
    display: flex; flex-direction: column; gap: 8px;
  }
  .pop[hidden], .pop [hidden] { display: none; }
  .pop .extra {
    width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px;
    font: 15px var(--mono); color: var(--ink);
  }
  .pop .extra:focus { outline: 2px solid var(--chord); outline-offset: 0; }
  .pop button {
    font: 700 14px var(--mono); min-height: 30px; padding: 4px 9px;
    border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--chord); cursor: pointer;
  }
  .pop button:hover { background: var(--chord); border-color: var(--chord); color: #fff; }
  .pop .remove { font: 600 14px system-ui, sans-serif; color: #b42318; }
  .pop .remove:hover { background: #b42318; border-color: #b42318; color: #fff; }
  .used {
    max-height: min(50vh, 360px); overflow-y: auto; display: flex; flex-direction: column; gap: 6px;
    border-top: 1px solid var(--line); padding-top: 8px;
  }
  .used-title { font: 600 13px system-ui, sans-serif; color: var(--muted); }
  .grp { display: flex; gap: 8px; align-items: flex-start; }
  .grp-name { flex: 0 0 34px; padding-top: 6px; font: 700 14px var(--mono); color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }

  @media print {
    @page { margin: 15mm; }
    body { display: block; padding: 0; background: #fff; }
    .editor, .pop, .empty-msg { display: none !important; }
    .sheet-wrap { border: 0; padding: 0; min-height: 0; }
    #sheetTitle.ph { display: none; }
    #sheet { font-size: 10.5pt; overflow: visible; }
    .chords { cursor: default; height: 1.7em; }
    .chords.empty { height: .5em; }
    .chords.only { background: none; border-bottom: 0; }
    .chords.only.empty { display: none; }
    .chords::after { display: none; }
    .chord, #sheetKey { color: #000; }
    .row { break-inside: avoid; }
  }
</style>
</head>
<body>

<section class="editor">
  <label for="title">Título da música</label>
  <input id="title" type="text" placeholder="Ex.: Trem das Onze">

  <label for="key">Tom da música</label>
  <input id="key" type="text" placeholder="Ex.: G, Am, F#m">

  <label for="lyrics">Letra</label>
  <textarea id="lyrics" placeholder="Cole ou escreva a letra aqui. Uma linha em branco separa as estrofes."></textarea>
  <div class="actions">
    <button class="btn" id="addLine" type="button" title="Insere uma linha só de acordes (introdução, interlúdio…)">+ Linha de acordes</button>
  </div>
  <p class="hint">Clique no espaço acima da letra para digitar a cifra. “+ Linha de acordes” cria uma linha sem letra (intro, interlúdio): abaixo da linha do cursor, ou acima se o cursor estiver no início dela. Para rótulos como [Intro], use uma linha comum.</p>

  <div class="lbl">Tonalidade</div>
  <div class="actions">
    <button class="btn" id="down" title="Descer meio tom">− ½ tom</button>
    <button class="btn" id="up" title="Subir meio tom">+ ½ tom</button>
    <button class="btn" id="swap" title="Trocar sustenidos por bemóis e vice-versa">♯ ⇄ ♭</button>
  </div>

  <div class="actions" style="margin-top:10px">
    <button class="btn primary" id="print">Imprimir</button>
    <button class="btn" id="clear">Limpar cifras</button>
  </div>
</section>

<main class="sheet-wrap">
  <header class="head">
    <h1 id="sheetTitle" class="ph">Título da música</h1>
    <p id="sheetKey" hidden></p>
  </header>
  <div id="sheet"></div>
</main>

<div id="pop1" class="pop" hidden></div>

<script>
(function () {
  const $ = s => document.querySelector(s);
  const titleIn = $('#title'), lyricsIn = $('#lyrics'), sheet = $('#sheet'), sheetTitle = $('#sheetTitle');
  const keyIn = $('#key'), sheetKey = $('#sheetKey');
  const pop1 = $('#pop1');
  const KEY = 'editor-cifras-v1';

  let chords = {};      // { indiceDaLinha: { coluna: 'C#' } }
  let pending = null;   // { line, col, letter }
  let CW = null;        // largura de um caractere
  let timer = null;
  let prevLines = [];

  /* ---------- utilitários de acordes ---------- */
  // Cada cifra é um texto livre digitado pelo usuário (ex.: 'Am7', 'C/E')
  const ONLY_COLS = 60;   // largura (em colunas) de uma linha só de acordes
  const SHARPS = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  const FLATS  = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
  const BASE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  const noteIdx = (L, a) => (BASE[L] + (a === '#' ? 1 : a === 'b' ? -1 : 0) + 12) % 12;
  const split = n => [n[0], n.slice(1)];

  function chordText(c) { return c.root + c.acc + (c.minor ? 'm' : '') + c.extra; }

  // Subir usa sustenidos; descer usa bemóis
  function shiftNote(L, a, steps) {
    return split((steps > 0 ? SHARPS : FLATS)[(noteIdx(L, a) + steps + 12) % 12]);
  }
  // Sustenido <-> bemol (notas naturais ficam como estão)
  function swapNote(L, a) {
    const i = noteIdx(L, a);
    return split(a === '#' ? FLATS[i] : a === 'b' ? SHARPS[i] : L);
  }
  // Aplica f à raiz e também ao baixo de acordes com barra (ex.: C/E)
  function mapChord(text, f) {
    const m = text.match(/^([A-G])([#b]?)(.*)$/);
    if (!m) return text;
    const [root, acc] = f(m[1], m[2]);
    return root + acc + m[3].replace(/\/([A-G])([#b]?)$/, (x, L, a) => '/' + f(L, a).join(''));
  }
  // Converte formatos antigos (objetos) para texto
  function migrate(all) {
    Object.keys(all).forEach(l => Object.keys(all[l]).forEach(c => {
      const v = all[l][c];
      if (v && typeof v === 'object') all[l][c] = chordText(v);
      else if (typeof v === 'string') all[l][c] = cleanChord(v);
    }));
    return all;
  }
  // Limpa o que foi digitado: sem espaços, ♯/♭ viram #/b, e a letra inicial e a primeira letra após a barra ficam maiúsculas
  function cleanChord(t) {
    return t.replace(/\s+/g, '').replace(/♯/g, '#').replace(/♭/g, 'b')
      .replace(/^[a-g]/, c => c.toUpperCase())
      .replace(/\/([a-g])/g, (m, c) => '/' + c.toUpperCase());
  }
  // Acordes já usados, agrupados pela nota (C, D, E...) a partir de C; C, C#, Db, Cm, C7M, C/E ficam todos no grupo C
  function usedChords() {
    const set = new Set();
    Object.values(chords).forEach(m => Object.values(m).forEach(t => set.add(t)));
    const groups = {};
    set.forEach(t => {
      const key = /^[A-G]/.test(t) ? t[0] : 'Outros';
      (groups[key] = groups[key] || []).push(t);
    });
    // dentro do grupo: natural, sustenido, bemol; depois maior, menor, números (7M, 9...), outros, baixo (C/E)
    const parts = t => { const a = (t.slice(1).match(/^[#b]/) || [''])[0]; return [a, t.slice(1 + a.length)]; };
    const rank = r => !r ? 0 : /^m(?!aj)/.test(r) ? 1 : /^\d/.test(r) ? 2 : r[0] === '/' ? 4 : 3;
    const accRank = { '': 0, '#': 1, b: 2 };
    return Object.keys(groups).sort((a, b) => (BASE[a] ?? 99) - (BASE[b] ?? 99)).map(k => ({
      root: k,
      items: groups[k].sort((x, y) => {
        if (k === 'Outros') return x.localeCompare(y);
        const [ax, rx] = parts(x), [ay, ry] = parts(y);
        return accRank[ax] - accRank[ay] || rank(rx) - rank(ry) || x.localeCompare(y, 'pt', { numeric: true });
      })
    }));
  }
  // Ajusta as cifras quando linhas da letra são inseridas, apagadas ou editadas
  function remap(oldL, newL) {
    const max = Math.min(oldL.length, newL.length);
    let p = 0, q = 0;
    while (p < max && oldL[p] === newL[p]) p++;
    while (q < max - p && oldL[oldL.length - 1 - q] === newL[newL.length - 1 - q]) q++;
    const out = {};
    Object.keys(chords).forEach(k => {
      const i = +k;
      let j = null;
      if (i < p) j = i;
      else if (i >= oldL.length - q) j = i + newL.length - oldL.length;
      else if (i - p < newL.length - q - p) j = i;
      if (j !== null) out[j] = chords[k];
    });
    chords = out;
  }

  /* ---------- persistência ---------- */
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ title: titleIn.value, key: keyIn.value, lyrics: lyricsIn.value, chords })); } catch (e) {}
  }
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (d) { titleIn.value = d.title || ''; keyIn.value = d.key || ''; lyricsIn.value = d.lyrics || ''; chords = migrate(d.chords || {}); }
  } catch (e) {}

  /* ---------- renderização ---------- */
  function getLines() {
    return lyricsIn.value.replace(/\r/g, '').replace(/\t/g, '    ').split('\n');
  }

  function getCW() {
    if (CW) return CW;
    const s = document.createElement('span');
    s.textContent = '0'.repeat(20);
    s.style.cssText = 'position:absolute;visibility:hidden;white-space:pre';
    sheet.appendChild(s);
    CW = s.getBoundingClientRect().width / 20;
    s.remove();
    return CW;
  }

  function render() {
    CW = null;
    const t = titleIn.value.trim();
    sheetTitle.textContent = t || 'Título da música';
    sheetTitle.classList.toggle('ph', !t);
    const k = keyIn.value.trim();
    sheetKey.hidden = !k; sheetKey.textContent = 'Tom: ' + k;
    document.title = t ? t + ' – Cifra' : 'Editor de cifras';
    sheet.innerHTML = '';

    if (!lyricsIn.value.trim()) {
      sheet.innerHTML = '<div class="empty-msg">A letra aparece aqui assim que você escrever.</div>';
      return;
    }

    getLines().forEach((text, i) => {
      if (!text.trim()) {
        const g = document.createElement('div'); g.className = 'gap'; sheet.appendChild(g); return;
      }
      const row = document.createElement('div'); row.className = 'row';
      const cr = document.createElement('div'); cr.className = 'chords';
      const only = text.trim() === '~';   // linha só de acordes
      const len = only ? ONLY_COLS : text.length;
      cr.dataset.line = i; cr.dataset.len = len;
      cr.classList.toggle('only', only);
      if (only) cr.style.width = (len + 1) + 'ch';
      let any = false;
      const map = chords[i] || {};
      Object.keys(map).forEach(c => {
        if (+c > len) return;
        const sp = document.createElement('span');
        sp.className = 'chord'; sp.dataset.col = c; sp.style.setProperty('--col', c);
        sp.textContent = map[c];
        cr.appendChild(sp); any = true;
      });
      cr.classList.toggle('empty', !any);
      row.appendChild(cr);
      if (!only) {
        const lt = document.createElement('div'); lt.className = 'lyric'; lt.textContent = text;
        row.appendChild(lt);
      }
      sheet.appendChild(row);
    });
  }

  function colFromEvent(e, cr) {
    const chord = e.target.closest('.chord');
    if (chord) return +chord.dataset.col;
    const col = Math.floor((e.clientX - cr.getBoundingClientRect().left) / getCW());
    return Math.max(0, Math.min(col, +cr.dataset.len));
  }

  /* ---------- popup de cifra ---------- */
  const mk = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text) n.textContent = text;
    return n;
  };
  const btn = (text, onClick, cls) => {
    const b = mk('button', cls, text); b.type = 'button'; b.addEventListener('click', onClick); return b;
  };

  const input = mk('input', 'extra');
  input.type = 'text'; input.autocomplete = 'off'; input.spellcheck = false;
  input.placeholder = 'Digite a cifra: Am7, C/E, F#m7(b5)…';
  input.setAttribute('aria-label', 'Cifra');
  const removeBtn = btn('Remover cifra', () => removeChord(), 'remove');
  const usedBox = mk('div', 'used');
  pop1.append(input, removeBtn, usedBox);

  let dirty = false;   // o usuário já digitou algo: o popup não some ao tirar o mouse
  input.addEventListener('input', () => { dirty = true; });
  input.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const t = cleanChord(input.value);
    if (t) setChord(t); else removeChord();   // campo vazio = limpa a cifra
  });

  function fillUsed() {
    usedBox.innerHTML = '';
    const groups = usedChords();
    if (!groups.length) return;
    usedBox.appendChild(mk('div', 'used-title', 'Acordes usados'));
    groups.forEach(g => {
      const row = mk('div', 'grp');
      const chips = mk('div', 'chips');
      g.items.forEach(t => chips.appendChild(btn(t, () => setChord(t))));
      row.append(mk('span', 'grp-name', g.root), chips);
      usedBox.appendChild(row);
    });
  }

  function place(pop, x, y) {
    pop.hidden = false;
    const w = pop.offsetWidth, h = pop.offsetHeight;
    pop.style.left = Math.max(4, Math.min(x - 14, innerWidth - w - 4)) + 'px';
    pop.style.top = Math.max(4, Math.min(y - 14, innerHeight - h - 4)) + 'px';
  }
  function hideAll() {
    pop1.hidden = true;
    clearTimeout(timer); timer = null;
  }

  function openChordPopup(x, y) {
    const cur = (chords[pending.line] || {})[pending.col] || '';
    input.value = cur; dirty = false;
    removeBtn.hidden = !cur;
    fillUsed();
    clearTimeout(timer); timer = null;
    place(pop1, x, y);
    input.focus({ preventScroll: true }); input.select();
  }

  function setChord(text) {
    const { line, col } = pending;
    (chords[line] = chords[line] || {})[col] = text;
    save(); render(); hideAll();
  }

  function removeChord() {
    const { line, col } = pending;
    if (chords[line]) { delete chords[line][col]; if (!Object.keys(chords[line]).length) delete chords[line]; }
    save(); render(); hideAll();
  }

  // Some depois de um breve intervalo quando o mouse sai do popup (exceto depois de digitar nele)
  document.addEventListener('mousemove', e => {
    if (pop1.hidden) return;
    const r = pop1.getBoundingClientRect();
    const inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
    if (inside || dirty) { clearTimeout(timer); timer = null; }
    else if (!timer) timer = setTimeout(() => { timer = null; if (!dirty) hideAll(); }, 350);
  });
  document.addEventListener('mousedown', e => { if (!e.target.closest('.pop')) hideAll(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') hideAll(); });

  /* ---------- interações na cifra ---------- */
  sheet.addEventListener('mousemove', e => {
    const cr = e.target.closest('.chords');
    if (cr) cr.style.setProperty('--mx', colFromEvent(e, cr) + 'ch');
  });
  sheet.addEventListener('click', e => {
    const cr = e.target.closest('.chords');
    if (!cr) return;
    pending = { line: +cr.dataset.line, col: colFromEvent(e, cr) };
    openChordPopup(e.clientX, e.clientY);
  });

  /* ---------- controles ---------- */
  titleIn.addEventListener('input', () => { render(); save(); });
  keyIn.addEventListener('input', () => { render(); save(); });

  // Aplica f a todas as cifras e ao tom (quando ele é uma nota simples, como G, Am ou F#m)
  function mapAll(f) {
    Object.keys(chords).forEach(l => Object.keys(chords[l]).forEach(c => { chords[l][c] = mapChord(chords[l][c], f); }));
    const m = keyIn.value.trim().match(/^([A-G])([#b]?)(m?)$/);
    if (m) keyIn.value = f(m[1], m[2]).join('') + m[3];
    save(); render();
  }
  $('#up').addEventListener('click', () => mapAll((L, a) => shiftNote(L, a, 1)));
  $('#down').addEventListener('click', () => mapAll((L, a) => shiftNote(L, a, -1)));
  $('#swap').addEventListener('click', () => mapAll(swapNote));
  function onLyrics() {
    const now = getLines();
    remap(prevLines, now); prevLines = now;
    render(); save();
  }
  lyricsIn.addEventListener('input', onLyrics);

  // Linha só de acordes = linha com apenas "~" na letra
  $('#addLine').addEventListener('click', () => {
    const v = lyricsIn.value;
    const pos = lyricsIn.selectionStart == null ? v.length : lyricsIn.selectionStart;
    const start = pos === 0 ? 0 : v.lastIndexOf('\n', pos - 1) + 1;
    let caret;
    if (pos === start) {   // cursor no início de uma linha: insere acima
      lyricsIn.value = v.slice(0, start) + '~' + (v.length > start ? '\n' : '') + v.slice(start);
      caret = start + 1;
    } else {               // senão: insere abaixo da linha atual
      let end = v.indexOf('\n', pos);
      if (end === -1) end = v.length;
      lyricsIn.value = v.slice(0, end) + '\n~' + v.slice(end);
      caret = end + 2;
    }
    lyricsIn.focus(); lyricsIn.setSelectionRange(caret, caret);
    onLyrics();
  });
  $('#print').addEventListener('click', () => { hideAll(); window.print(); });
  $('#clear').addEventListener('click', () => {
    if (Object.keys(chords).length && confirm('Remover todas as cifras desta música?')) {
      chords = {}; save(); render();
    }
  });

  prevLines = getLines();
  render();
})();
</script>
</body>
</html>
