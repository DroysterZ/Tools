<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Cadastro de Matérias</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
  h1 { font-size: 18px; }
  form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  label { font-size: 14px; color: #333; }
  input[type="text"] { padding: 8px; font-size: 14px; }
  textarea { width: 100%; height: 250px; padding: 8px; font-size: 13px; box-sizing: border-box; }
  button { padding: 8px 16px; font-size: 14px; cursor: pointer; align-self: flex-start; }
  #status { font-size: 12px; color: green; height: 16px; }
</style>
</head>
<body>

<h1>Cadastro de Matérias</h1>

<form id="form">
  <label>Matéria<br><input type="text" id="materia" autocomplete="off"></label>
  <label>Nota<br><input type="text" id="nota" autocomplete="off"></label>
  <label>Carga horária<br><input type="text" id="carga" autocomplete="off"></label>
  <label>Faltas<br><input type="text" id="faltas" autocomplete="off"></label>
</form>

<p>Clique na caixa abaixo para copiar tudo (em uma linha) para o clipboard.</p>
<textarea id="saida" readonly></textarea>
<div id="status"></div>
<br>
<button id="limpar">Limpar</button>

<script>
  const materia = document.getElementById('materia');
  const nota = document.getElementById('nota');
  const carga = document.getElementById('carga');
  const faltas = document.getElementById('faltas');
  const saida = document.getElementById('saida');
  const status = document.getElementById('status');
  const form = document.getElementById('form');

  function capitalizar(texto) {
    return texto
      .toLowerCase()
      .split(' ')
      .map(palavra => palavra.charAt(0).toUpperCase() + palavra.slice(1))
      .join(' ');
  }

  form.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      const nomeMateria = capitalizar(materia.value);
      const linha = `${nomeMateria} - nota: ${nota.value}, carga horária: ${carga.value}, faltas: ${faltas.value};`;
      saida.value += (saida.value ? '\n' : '') + linha;

      materia.value = '';
      nota.value = '';
      carga.value = '';
      faltas.value = '';
      materia.focus();
    }
  });

  saida.addEventListener('click', function() {
    const texto = saida.value.replace(/\n/g, ' ');
    navigator.clipboard.writeText(texto).then(function() {
      status.textContent = 'Copiado para o clipboard!';
      setTimeout(() => status.textContent = '', 1500);
    });
  });

  document.getElementById('limpar').addEventListener('click', function() {
    saida.value = '';
    materia.focus();
  });

  materia.focus();
</script>

</body>
</html>
