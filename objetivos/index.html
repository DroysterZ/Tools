<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Objetivos</title>
<style>
:root{
  --bg:#12202b; --panel:#1a2c3a; --panel2:#223646; --line:#2f4659;
  --text:#e8eef3; --muted:#8fa5b5; --accent:#f0b24a; --done:#6cc08b; --danger:#e07a6b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:.4rem .75rem}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);color:#1b1405;border-color:var(--accent);font-weight:600}
button.ghost{background:none;border-color:transparent;color:var(--muted);padding:.25rem .5rem}
button.ghost:hover{color:var(--text)}
button.danger:hover{color:var(--danger)}
input[type=text]{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:.45rem .65rem;width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100%}
aside{background:var(--panel);border-right:1px solid var(--line);padding:1rem;display:flex;flex-direction:column;gap:1rem}
aside h1{font-size:1.15rem;margin:0}
.add{display:flex;gap:.4rem}
.add button{flex:none}
.goals{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.35rem;flex:1;overflow:auto}
.goal{width:100%;text-align:left;display:block;padding:.55rem .7rem;background:none;border:1px solid transparent}
.goal:hover{background:var(--panel2)}
.goal.active{background:var(--panel2);border-color:var(--line);border-left:3px solid var(--accent)}
.goal small{display:block;color:var(--muted)}
.bar{height:5px;background:var(--bg);border-radius:3px;overflow:hidden;margin-top:.35rem}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.bar.full i{background:var(--done)}
.tools{display:flex;gap:.4rem;flex-wrap:wrap}
main{padding:1.5rem clamp(1rem,4vw,3rem);max-width:820px;width:100%}
.head{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.head h2{margin:0;font-size:1.6rem;flex:1;min-width:10rem}
.sum{color:var(--muted);margin:.3rem 0 .6rem}
.newsec{margin:1.2rem 0}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:.9rem}
.sec-h{display:flex;align-items:center;gap:.4rem;padding:.55rem .7rem}
.sec-h .toggle{flex:1;text-align:left;background:none;border:0;font-weight:600;padding:.2rem}
.sec-h .count{color:var(--muted);font-size:.9rem}
.sec.complete .count{color:var(--done)}
.items{list-style:none;margin:0;padding:0 .7rem .5rem}
.item{display:flex;align-items:center;gap:.6rem;padding:.35rem 0;border-top:1px solid var(--line)}
.item label{flex:1;display:flex;align-items:center;gap:.65rem;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.item input[type=checkbox]{width:1.15rem;height:1.15rem;accent-color:var(--done);flex:none}
.item.done span{color:var(--muted);text-decoration:line-through}
.item .x{opacity:.5}
.item:hover .x,.item .x:focus-visible{opacity:1}
.sec .add{padding:.2rem .7rem .7rem}
.empty{color:var(--muted);padding:2rem 0}
.hidden{display:none}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  aside{border-right:0;border-bottom:1px solid var(--line)}
  .goals{max-height:30vh}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Meus objetivos</h1>
    <form class="add" id="f-goal">
      <input type="text" id="n-goal" placeholder="Novo objetivo (ex.: Zerar Terraria)" aria-label="Nome do novo objetivo" autocomplete="off">
      <button class="primary" type="submit">Criar</button>
    </form>
    <ul class="goals" id="goals"></ul>
    <div class="tools">
      <button id="exp">Exportar</button>
      <button id="imp">Importar</button>
      <input type="file" id="file" accept="application/json" class="hidden">
    </div>
  </aside>
  <main id="main"></main>
</div>

<script>
const KEY = 'objetivos.v1';
let state = load();

function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.goals)) return s;
  }catch(e){}
  return {goals:[], current:null};
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ console.warn('Não foi possível salvar', e); }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cur = () => state.goals.find(g => g.id === state.current);
const stats = items => ({done: items.filter(i => i.done).length, total: items.length});
const goalStats = g => stats(g.sections.flatMap(s => s.items));
const pct = ({done,total}) => total ? Math.round(done/total*100) : 0;

function render(){
  // lista lateral
  const list = document.getElementById('goals');
  list.innerHTML = state.goals.length ? state.goals.map(g => {
    const st = goalStats(g), p = pct(st);
    return `<li><button class="goal ${g.id===state.current?'active':''}" data-a="open" data-g="${g.id}">
      ${esc(g.name)}<small>${st.done}/${st.total} concluídos</small>
      <div class="bar ${p===100&&st.total?'full':''}"><i style="width:${p}%"></i></div></button></li>`;
  }).join('') : '<li class="empty">Nenhum objetivo ainda.</li>';

  // painel principal
  const main = document.getElementById('main');
  const g = cur();
  if (!g){
    main.innerHTML = '<p class="empty">Crie um objetivo ao lado para começar.</p>';
    return;
  }
  const st = goalStats(g), p = pct(st);
  main.innerHTML = `
    <div class="head">
      <h2>${esc(g.name)}</h2>
      <button class="ghost" data-a="ren-goal">Renomear</button>
      <button class="ghost" data-a="reset-goal">Desmarcar tudo</button>
      <button class="ghost danger" data-a="del-goal">Excluir</button>
    </div>
    <p class="sum">${st.done} de ${st.total} concluídos (${p}%)</p>
    <div class="bar ${p===100&&st.total?'full':''}"><i style="width:${p}%"></i></div>
    <form class="add newsec" data-f="sec">
      <input type="text" placeholder="Nova seção (ex.: Pré-bosses)" aria-label="Nome da nova seção" autocomplete="off">
      <button class="primary" type="submit">Adicionar seção</button>
    </form>
    ${g.sections.length ? g.sections.map(secHTML).join('') : '<p class="empty">Adicione uma seção para organizar as tarefas deste objetivo.</p>'}`;
}

function secHTML(s){
  const st = stats(s.items);
  const complete = st.total && st.done === st.total;
  return `<section class="sec ${complete?'complete':''}" data-s="${s.id}">
    <div class="sec-h">
      <button class="toggle" data-a="toggle-sec" aria-expanded="${!s.collapsed}">${s.collapsed?'▸':'▾'} ${esc(s.name)}</button>
      <span class="count">${st.done}/${st.total}</span>
      <button class="ghost" data-a="ren-sec">Renomear</button>
      <button class="ghost danger" data-a="del-sec" aria-label="Excluir seção ${esc(s.name)}">Excluir</button>
    </div>
    <div class="${s.collapsed?'hidden':''}">
      <ul class="items">${s.items.map(i => `
        <li class="item ${i.done?'done':''}" data-i="${i.id}">
          <label><input type="checkbox" data-a="check" ${i.done?'checked':''}><span>${esc(i.text)}</span></label>
          <button class="ghost x" data-a="ren-item" aria-label="Editar item">Editar</button>
          <button class="ghost x danger" data-a="del-item" aria-label="Excluir item">✕</button>
        </li>`).join('')}</ul>
      <form class="add" data-f="item">
        <input type="text" placeholder="Novo item" aria-label="Novo item em ${esc(s.name)}" autocomplete="off">
        <button type="submit">Adicionar</button>
      </form>
    </div>
  </section>`;
}

// criar objetivo
document.getElementById('f-goal').addEventListener('submit', e => {
  e.preventDefault();
  const inp = document.getElementById('n-goal');
  const name = inp.value.trim();
  if (!name) return;
  const g = {id:uid(), name, sections:[]};
  state.goals.push(g); state.current = g.id;
  inp.value = ''; save(); render();
});

// seções e itens (formulários)
document.getElementById('main').addEventListener('submit', e => {
  const f = e.target.closest('form[data-f]');
  if (!f) return;
  e.preventDefault();
  const inp = f.querySelector('input'), text = inp.value.trim();
  const g = cur();
  if (!text || !g) return;
  if (f.dataset.f === 'sec'){
    g.sections.push({id:uid(), name:text, collapsed:false, items:[]});
  } else {
    const s = g.sections.find(x => x.id === f.closest('.sec').dataset.s);
    s.items.push({id:uid(), text, done:false});
  }
  const secId = f.closest('.sec')?.dataset.s;
  save(); render();
  // mantém o foco no campo para adicionar vários itens em sequência
  const next = secId ? document.querySelector(`.sec[data-s="${secId}"] form input`) : document.querySelector('form[data-f="sec"] input');
  if (next) next.focus();
});

// ações (cliques e checkboxes)
function onAction(e){
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const a = el.dataset.a, g = cur();
  const secEl = el.closest('.sec'), itemEl = el.closest('.item');
  const sec = g && secEl ? g.sections.find(s => s.id === secEl.dataset.s) : null;
  const item = sec && itemEl ? sec.items.find(i => i.id === itemEl.dataset.i) : null;

  if (a === 'open'){ state.current = el.dataset.g; }
  else if (a === 'check'){ if (e.type !== 'change') return; item.done = el.checked; }
  else if (e.type === 'change') return;
  else if (a === 'toggle-sec'){ sec.collapsed = !sec.collapsed; }
  else if (a === 'ren-goal'){ const n = prompt('Novo nome do objetivo:', g.name); if (!n || !n.trim()) return; g.name = n.trim(); }
  else if (a === 'ren-sec'){ const n = prompt('Novo nome da seção:', sec.name); if (!n || !n.trim()) return; sec.name = n.trim(); }
  else if (a === 'ren-item'){ const n = prompt('Editar item:', item.text); if (!n || !n.trim()) return; item.text = n.trim(); }
  else if (a === 'del-item'){ sec.items = sec.items.filter(i => i !== item); }
  else if (a === 'del-sec'){
    if (sec.items.length && !confirm(`Excluir a seção "${sec.name}" e seus ${sec.items.length} itens?`)) return;
    g.sections = g.sections.filter(s => s !== sec);
  }
  else if (a === 'reset-goal'){
    if (!confirm('Desmarcar todos os itens deste objetivo?')) return;
    g.sections.forEach(s => s.items.forEach(i => i.done = false));
  }
  else if (a === 'del-goal'){
    if (!confirm(`Excluir o objetivo "${g.name}" e tudo dentro dele?`)) return;
    state.goals = state.goals.filter(x => x !== g);
    state.current = state.goals[0]?.id ?? null;
  }
  save(); render();
}
document.addEventListener('click', onAction);
document.addEventListener('change', onAction);

// exportar / importar
document.getElementById('exp').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'objetivos-backup.json';
  a.click();
  URL.revokeObjectURL(a.href);
});
document.getElementById('imp').addEventListener('click', () => document.getElementById('file').click());
document.getElementById('file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const s = JSON.parse(r.result);
      if (!Array.isArray(s.goals)) throw new Error();
      if (!confirm('Importar vai substituir os objetivos atuais. Continuar?')) return;
      state = s; save(); render();
    }catch(err){ alert('Arquivo inválido. Use um backup exportado por esta ferramenta.'); }
  };
  r.readAsText(f);
  e.target.value = '';
});

if (!cur()) state.current = state.goals[0]?.id ?? null;
render();
</script>
</body>
</html>
